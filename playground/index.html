<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zubra playground</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <strong class="brand">zubra <span>playground</span></strong>
    <label>Example
      <select id="example"></select>
    </label>
    <span class="status" id="status" role="status">Loading the compiler…</span>
    <button type="button" id="share">Copy link</button>
    <a href="../docs/" id="docs-link">Docs</a>
  </header>
  <main>
    <section class="pane source" aria-label="Source">
      <div class="label"><span>component.zb</span><small id="tab-hint" aria-live="polite">Tab indents · <kbd>Esc</kbd> or <kbd>Ctrl</kbd>+<kbd>M</kbd>: Tab moves focus</small></div>
      <textarea id="source" spellcheck="false" aria-label="Component source" aria-describedby="tab-hint"></textarea>
      <div class="label"><span>page.html</span><small>where the element is used, in the plain HTML preview</small></div>
      <textarea id="page" spellcheck="false" aria-label="Page markup" aria-describedby="tab-hint" class="short"></textarea>
    </section>
    <section class="pane output" aria-label="Output">
      <div role="tablist" aria-label="Output" id="tabs">
        <button type="button" role="tab" id="tab-preview" aria-controls="panel-preview" aria-selected="true" tabindex="0" data-tab="preview">Preview</button>
        <button type="button" role="tab" id="tab-element" aria-controls="panel-element" aria-selected="false" tabindex="-1" data-tab="element" title="zubra compile --emit element: the custom element as you'd write it by hand">Element</button>
        <button type="button" role="tab" id="tab-js" aria-controls="panel-js" aria-selected="false" tabindex="-1" data-tab="js" title="zubra compile --emit js: the module for @zubra/runtime, which the preview runs">Runtime module</button>
        <button type="button" role="tab" id="tab-html" aria-controls="panel-html" aria-selected="false" tabindex="-1" data-tab="html">Server HTML</button>
        <button type="button" role="tab" id="tab-dts" aria-controls="panel-dts" aria-selected="false" tabindex="-1" data-tab="dts">Typings</button>
        <button type="button" role="tab" id="tab-manifest" aria-controls="panel-manifest" aria-selected="false" tabindex="-1" data-tab="manifest">Manifest</button>
        <button type="button" role="tab" id="tab-server" aria-controls="panel-server" aria-selected="false" tabindex="-1" data-tab="server">Server</button>
      </div>
      <div id="error" class="error" hidden></div>
      <div class="panel" data-panel="preview" id="panel-preview" role="tabpanel" aria-labelledby="tab-preview">
        <div class="previews" id="previews"></div>
      </div>
      <pre class="panel code" data-panel="element" id="panel-element" role="tabpanel" aria-labelledby="tab-element" tabindex="0" hidden><code id="out-element"></code></pre>
      <pre class="panel code" data-panel="js" id="panel-js" role="tabpanel" aria-labelledby="tab-js" tabindex="0" hidden><code id="out-js"></code></pre>
      <pre class="panel code" data-panel="html" id="panel-html" role="tabpanel" aria-labelledby="tab-html" tabindex="0" hidden><code id="out-html"></code></pre>
      <pre class="panel code" data-panel="dts" id="panel-dts" role="tabpanel" aria-labelledby="tab-dts" tabindex="0" hidden><code id="out-dts"></code></pre>
      <pre class="panel code" data-panel="manifest" id="panel-manifest" role="tabpanel" aria-labelledby="tab-manifest" tabindex="0" hidden><code id="out-manifest"></code></pre>
      <pre class="panel code" data-panel="server" id="panel-server" role="tabpanel" aria-labelledby="tab-server" tabindex="0" hidden><code id="out-server"></code></pre>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
