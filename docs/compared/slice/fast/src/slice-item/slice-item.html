<f-template name="slice-item">
  <template>
    <link rel="stylesheet" href="/slice.css">
    <h3 ?data-out="{{left == 0}}">{{name}}</h3>
    <p class="meta">{{price}} · {{unit}}<f-when value="{{left > 0}}"> · <span class="left">{{left}} left</span></f-when><f-when value="{{left == 0}}"> · <span class="left">Sold out</span></f-when></p>
    <form method="post" action="{{add}}">
      <input type="hidden" name="item" value="{{item}}">
      <input type="number" name="qty" value="1" min="1" max="24" aria-label="How many {{name}}" ?disabled="{{left == 0}}">
      <button type="submit" ?disabled="{{left == 0}}">Add</button>
    </form>
  </template>
</f-template>
